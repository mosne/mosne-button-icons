name: "Check plugin version and tags"
on:
  pull_request:
    branches:
      - main

jobs:
  version-check:
    name: "Check version does not already exist"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set-vars
        name: "Set variables from .plugin-data file"
        run: |
          VERSION=$(jq -r '.version' .plugin-data)
          SLUG=$(jq -r '.slug' .plugin-data)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - id: version-check
        name: "Check version in .plugin-data is not existing"
        run: |
          VERSION=${{ steps.set-vars.outputs.version }}

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists please update the .plugin-data file to a good version";
            exit 1;
          fi
